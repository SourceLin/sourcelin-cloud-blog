# Tomcat
server:
  port: 9201

# Spring
spring:
  http:
    converters:
      preferred-json-mapper: jackson2
    codecs:
      preferred-json-mapper: jackson2
  config:
    import:
      - "optional:nacos:application-${spring.profiles.active}.yml?group=${spring.cloud.nacos.config.group}&refreshEnabled=true"
      - "optional:nacos:${spring.application.name}-${spring.profiles.active}.yml?group=${spring.cloud.nacos.config.group}&refreshEnabled=true"
  application:
    # 应用名称
    name: sourcelin-system
  profiles:
    # 环境配置
    active: dev
  data:
    redis:
      host: ${SYSTEM_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SYSTEM_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${SYSTEM_REDIS_PASSWORD:${REDIS_PASSWORD:}}
  datasource:
    druid:
      dynamic:
        datasource:
          master:
            driver-class-name: com.mysql.cj.jdbc.Driver
            url: ${SYSTEM_DB_URL:${DB_URL:jdbc:mysql://127.0.0.1:3306/sourcelin-cloud?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8}}
            username: ${SYSTEM_DB_USERNAME:${DB_USERNAME:root}}
            password: ${SYSTEM_DB_PASSWORD:${DB_PASSWORD:}}
        # 连接池与动态路由的基础参数（用于兜底；若 Nacos 配置解析成功将被其覆盖/合并）
        druid:
          initial-size: 5
          min-idle: 5
          maxActive: 20
          maxWait: 60000
          connectTimeout: 30000
          socketTimeout: 60000
          timeBetweenEvictionRunsMillis: 60000
          minEvictableIdleTimeMillis: 300000
          validationQuery: SELECT 1 FROM DUAL
          testWhileIdle: true
          testOnBorrow: false
          testOnReturn: false
          poolPreparedStatements: true
          maxPoolPreparedStatementPerConnectionSize: 20
          filters: stat,slf4j
          connectionProperties: druid.stat.mergeSql\=true;druid.stat.slowSqlMillis\=5000
    # dynamic-datasource 默认配置兜底（确保 primary 数据源可用）
    dynamic:
      primary: master
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: ${SYSTEM_DB_URL:${DB_URL:jdbc:mysql://127.0.0.1:3306/sourcelin-cloud?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8}}
          username: ${SYSTEM_DB_USERNAME:${DB_USERNAME:root}}
          password: ${SYSTEM_DB_PASSWORD:${DB_PASSWORD:}}
      druid:
        initial-size: 5
        min-idle: 5
        maxActive: 20
        maxWait: 60000
        connectTimeout: 30000
        socketTimeout: 60000
        timeBetweenEvictionRunsMillis: 60000
        minEvictableIdleTimeMillis: 300000
        validationQuery: SELECT 1 FROM DUAL
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
        poolPreparedStatements: true
        maxPoolPreparedStatementPerConnectionSize: 20
        filters: stat,slf4j
        connectionProperties: druid.stat.mergeSql\=true;druid.stat.slowSqlMillis\=5000
  cloud:
    nacos:
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        # 分组
        group: ${NACOS_GROUP:BLOG_GROUP}
        # 服务注册地址
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        namespace: ${NACOS_NAMESPACE:}
        # 分组
        group: ${NACOS_GROUP:BLOG_GROUP}
        # 配置中心地址
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        # 配置文件格式
        file-extension: yml

# mybatis兜底配置（Nacos 配置解析异常时也能保证 mapper XML 可加载）
mybatis:
  type-aliases-package: com.sourcelin.system.domain
  mapper-locations: classpath:mapper/**/*.xml